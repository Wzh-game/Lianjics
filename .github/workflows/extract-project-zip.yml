name: Extract uploaded project ZIP

on:
  push:
    paths:
      - "Lianics-upload-root.zip"
      - "Lianjics-upload-root.zip"
      - ".github/workflows/extract-project-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate and extract project files into repository root
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          candidates = [Path("Lianics-upload-root.zip"), Path("Lianjics-upload-root.zip")]
          archive = next((p for p in candidates if p.is_file()), None)
          if archive is None:
              raise SystemExit("No uploaded project ZIP was found in the repository root.")

          allowed_roots = {"README.md", "build.js", "index.html"}
          required = [
              "README.md", "build.js", "index.html",
              "src/00_head.html", "src/01_core.js",
              "src/02_entities.js", "src/03_net.js",
              "src/04_game.js", "src/05_extract.js",
              "src/06_extract_ui.js", "src/three.min.js",
          ]

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP integrity check failed: {bad}")

              extracted = set()
              for name in zf.namelist():
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if name.endswith("/") or name in {".sudo_as_admin_successful", "delta/.sudo_as_admin_successful"}:
                      continue

                  parts = p.parts
                  if parts and parts[0] == "delta":
                      parts = parts[1:]
                  if not parts:
                      continue
                  normalized = PurePosixPath(*parts).as_posix()

                  if not (normalized in allowed_roots or normalized.startswith("src/")):
                      raise SystemExit(f"Unexpected file in archive: {name}")

                  target = Path(normalized)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(name))
                  extracted.add(normalized)

          missing = sorted(set(required) - extracted)
          if missing:
              raise SystemExit("Missing expected project files: " + ", ".join(missing))

          archive.unlink()
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted project changes to commit."
          else
            git commit -m "Upload and extract Lianjics project"
            git push
          fi
